[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risklib"
version = "0.6.0"
description = "Quantitative risk engine for long-only equity portfolios: factor model, GARCH, VaR/ES, stress testing and backtesting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
risklib = "risklib.__main__:main"

[tool.setuptools.packages.find]
include = ["risklib*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E702", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
